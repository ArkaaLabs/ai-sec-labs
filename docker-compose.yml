# ai-sec-labs — lab orchestration.
#
# Nothing starts by default. Every service sits behind a profile so a laptop
# runs one lab at a time instead of the whole catalog. Use the Makefile:
#   make up              catalog only
#   make lab LAB=1.2.2   that lab plus whatever it needs
#
# All ports bind to 127.0.0.1. These are deliberately vulnerable targets and
# must never be reachable from the network. Do not change this to 0.0.0.0.

name: ai-sec-labs

services:
  # ---- catalog: static launcher, the only thing you open by hand ----
  catalog:
    image: nginx:alpine
    profiles: [core]
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8088}:80"
    volumes:
      - ./catalog:/usr/share/nginx/html:ro
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ---- ollama: one model server shared by every lab ----
  # Without this, each upstream project pulls its own copy of the weights.
  ollama:
    image: ollama/ollama:latest
    profiles: [model]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- LLMVault: OWASP LLM Top 10 range (Modules 1.2, 1.4) ----
  llmvault:
    build:
      context: ./upstream/llmvault
    profiles: [llmvault]
    ports:
      - "127.0.0.1:${LLMVAULT_PORT:-8081}:5000"
    environment:
      # Live Mode talks to the shared Ollama rather than its own.
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ---- DVMCP: vulnerable MCP server (Module 1.3) ----
  # UNVERIFIED: upstream ships no Dockerfile we have confirmed, and its ref is
  # not pinned to a SHA yet. Expect to supply a Dockerfile or run it manually.
  # Enable only after you have read its setup docs. See docs/STATUS.md.
  # dvmcp:
  #   build:
  #     context: ./upstream/dvmcp
  #   profiles: [dvmcp]
  #   ports:
  #     - "127.0.0.1:8001-8010:8001-8010"
  #   restart: unless-stopped

volumes:
  ollama:
