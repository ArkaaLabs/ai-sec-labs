# Serves the static catalog only.
#
# Labs are published on their own localhost ports rather than behind a path
# prefix here. The upstream apps build absolute URLs for their own static
# assets, so reverse-proxying them under /llmvault/ breaks their CSS and
# form posts. Separate ports are uglier in the address bar and actually work.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /labs.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
}
